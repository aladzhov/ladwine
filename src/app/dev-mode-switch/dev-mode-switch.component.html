<div class="dev-mode">
  @if (open()) {
    <div class="dev-mode-menu" role="menu" aria-label="Site mode" (click)="$event.stopPropagation()">
      <button
        type="button"
        role="menuitemradio"
        class="dev-mode-option"
        [attr.aria-checked]="!siteMode.isProduction()"
        (click)="select(false, $event)"
      >
        Local
      </button>
      <button
        type="button"
        role="menuitemradio"
        class="dev-mode-option"
        [attr.aria-checked]="siteMode.isProduction()"
        (click)="select(true, $event)"
      >
        Production preview
      </button>
      <label class="dev-mode-month">
        Background month
        <select (change)="selectMonth($event)">
          <option value="" [selected]="!siteMode.monthOverride()">Current ({{ currentMonth }})</option>
          @for (month of months; track month.value) {
            <option [value]="month.value" [selected]="siteMode.monthOverride() === month.value">{{ month.label }}</option>
          }
        </select>
      </label>
    </div>
  }
  <button
    type="button"
    class="dev-mode-toggle"
    [class.prod]="siteMode.isProduction()"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    (click)="toggle($event)"
  >
    {{ siteMode.isProduction() ? 'PROD' : 'LOCAL' }}{{ siteMode.monthOverride() ? ' · ' + siteMode.monthOverride() : '' }}
  </button>
</div>
