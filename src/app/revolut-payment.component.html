<div class="revolut-payment">
  <div class="payment-info">
    <div class="payment-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" fill="#0075EB"/>
        <path d="M13.5 7h-3.25C9.56 7 9 7.56 9 8.25v1.5C9 10.44 9.56 11 10.25 11H13c.55 0 1 .45 1 1s-.45 1-1 1h-4v2h2v1.5h2V15h.5c1.38 0 2.5-1.12 2.5-2.5S14.88 10 13.5 10H10.5V9H14V7h-.5z" fill="#0075EB"/>
      </svg>
    </div>
    <p class="payment-description">
      You will be redirected to <strong>Revolut</strong> secure checkout to complete your payment of
      <strong>{{ amount() | currency: currency() : 'symbol' : '1.2-2' }}</strong>.
    </p>
  </div>

  @if (error()) {
    <div class="payment-error">
      <span>⚠️ {{ error() }}</span>
    </div>
  }

  <button
    type="button"
    class="pay-now-btn revolut-btn"
    [disabled]="isProcessing()"
    (click)="initiatePayment()"
  >
    @if (isProcessing()) {
      <span class="spinner"></span> Processing…
    } @else {
      Pay Now with Revolut
    }
  </button>

  <p class="payment-note">
    Secure payment powered by Revolut. Your card details are handled directly by Revolut — we never see them.
  </p>
</div>
